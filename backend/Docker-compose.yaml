services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/urlshortener
      - REDIS_URL=redis://redis:6379
      - ACCESS_TOKEN_SECRET=local_dev_secret_123
      - REFRESH_TOKEN_SECRET=local_dev_refresh_secret_123
    
    depends_on:
      - mongo
      - redis


  mongo:
    image: mongo:latest
    container_name: local_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: local_redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:

